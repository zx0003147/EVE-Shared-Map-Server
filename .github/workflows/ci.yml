name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew --no-daemon --console=plain clean check
      - name: Install self-hosted script test tools
        run: sudo apt-get update && sudo apt-get install -y jq unzip shellcheck
      - name: Validate self-hosted scripts
        run: |
          bash -n install.sh ops/deploy.sh ops/generate-secrets.sh ops/eve-map ops/lib/eve-map-common.sh ops/tests/self-hosted-tests.sh
          shellcheck -x install.sh ops/deploy.sh ops/generate-secrets.sh ops/eve-map ops/lib/eve-map-common.sh ops/tests/self-hosted-tests.sh
          bash ops/tests/self-hosted-tests.sh
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml --profile ops config --quiet
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e SHARED_MAP_DOMAIN=markers.example.test
          -e SHARED_MAP_WEB_DOMAIN=map.example.test
          -e SHARED_MAP_ACME_EMAIL=admin@example.test
          -v "$PWD/ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile
